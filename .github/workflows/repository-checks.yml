name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalog-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog, publication policy, links, and preserved sources
        run: python tools/catalog.py check
      - name: Scan tracked text for credential patterns
        run: python tools/catalog.py scan
