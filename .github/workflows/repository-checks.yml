name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalog-and-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Validate catalog, publication policy, links, and preserved sources
        run: python tools/catalog.py check
      - name: Scan tracked text for credential patterns
        run: python tools/catalog.py scan
      - name: Test catalog publication and status rules
        run: python -m unittest tools.test_catalog
